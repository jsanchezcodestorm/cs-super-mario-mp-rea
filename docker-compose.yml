services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smw
      POSTGRES_USER: smw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - smw-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smw -d smw"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  smw-postgres:
